# PR Check Workflow for C# Library
# This workflow runs on pull requests to ensure code builds and tests pass (excluding Docker tests).

name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build and Test (No Docker)
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Get NuGet package metadata (name & version)
      - name: Get NuGet package metadata
        id: package-metadata
        run: |
          CSPROJ_PATH="src/Sitecore.API.Foundation.Authorization/Sitecore.API.Foundation.Authorization.csproj"
          PACKAGE_ID=$(dotnet msbuild -getProperty:PackageId "$CSPROJ_PATH" -nologo)
          PACKAGE_VERSION=$(dotnet msbuild -getProperty:PackageVersion "$CSPROJ_PATH" -nologo)

          echo "package-id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "package-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      # Check if NuGet package version exists using PackageMonster
      - name: Check if NuGet package version exists (PackageMonster)
        id: nuget-exists
        uses: KinsonDigital/PackageMonster@v1.0.0
        with:
          package-name: ${{ steps.package-metadata.outputs.package-id }}
          version: ${{ steps.package-metadata.outputs.package-version }}
          fail-when-not-found: true

      # Build in Release mode (net8.0, net9.0)
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Run tests with coverage (skip Docker-related tests)
      - name: Test with coverage (skip Docker integration)
        run: >
          dotnet test --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --filter "FullyQualifiedName~MockIntegrationTests|FullyQualifiedName~InfrastructureTests|FullyQualifiedName~UnitTests"

# End of workflow file
